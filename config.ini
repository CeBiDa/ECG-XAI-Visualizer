[processing]
; Comma-separated pre-processing steps, applied in order: notch, bandpass, wavelet, emd
pipeline =
; Notch filter frequency in Hz: 50 or 60
notch = 50
; Sampling rate in Hz to assume for files that store none (CSV, ASC, some MAT,
; XML/HL7 without a rate).
default_fs =
; Resample the processed signal to this rate in Hz (blank = keep the file's rate).
resample =
; Resampling method, also used to bring the model input to 500 Hz: fft | interpolation
resample_method = fft
; Derive missing leads (I, II, III, aVR, aVL, aVF) from the recorded ones
derive_leads = True
; Remove patient ID, names, birth date and exam date/time from the summary and the viewer
anonymize = False

[model]
; Model to run: cardiac-ischemia-xnet
name = cardiac-ischemia-xnet
; Decision threshold on P(ischemia); blank = the model's default (0.564)
threshold = 0.564
; Seconds into the record where the 3s model window starts
window_start = 0
; Run records that lack leads (neither recorded nor derivable) on zero-filled
; leads instead of skipping them.
allow_missing_leads = False
; Where the model runs: cpu | cuda | mps | auto
device = cpu

[patient]
; Age and sex come from the file first, then this CSV, then the fallbacks below.
metadata_csv =
; Used when neither the file nor the CSV has the value; blank = skip such files
fallback_age =
; Male | Female (M / F)
fallback_sex =

[xai]
; Attribution method: gradcam | saliency | smoothgrad | lime | all | none
method = gradcam
; Lead explained and segmented in the summary and the figures: I, II, III, aVR, aVL, aVF, V1 .. V6
lead = II
; Percentile above which attributions count as "top" in the segment split
top_percentile = 90
; Write <record>_xai.png per record
save_plots = True
; Write <record>_xai.npz (model input, attribution map, segment labels) per record
save_maps = False
; SmoothGrad x SIGN: number of noisy copies, and their SD in z-score units
smoothgrad_samples = 50
smoothgrad_noise = 0.2
; LIME: perturbed copies of the record, one model pass each
lime_samples = 1000
; Seed for the SmoothGrad noise and the LIME perturbations
seed = 0

[emd]
; Tuning for the 'emd' pipeline step. Blank entries keep the default. Values are
; always checked (a bad one stops every run) but only used with 'emd' in the pipeline.
; Decomposition: emd (fast) | eemd | ceemdan (slower, less mode mixing)
method = emd
; Drop the sub-baseline_cut components and the trend (removes baseline wander)
remove_baseline = True
; Hz - IMFs slower than this count as baseline wander
baseline_cut = 0.5
; Hz - IMFs faster than this count as noise and get interval-thresholded
noise_cut = 20.0
; Threshold scale; higher removes more noise, 0 keeps the noise IMFs whole
threshold = 1.0
; Interval thresholding: hard (keeps amplitudes) | soft (shrinks R waves, ~10% low)
thresholding = hard
; Relax the threshold inside QRS complexes instead of applying it blindly
protect_qrs = True
; Seconds - protected half-window around each detected R peak
qrs_halfwidth = 0.06
; Threshold multiplier inside that window (0 = leave the QRS completely untouched)
qrs_threshold_scale = 0.5
; Seconds - window the noise level is tracked over, so bursty artifacts still go
; (0 = one global estimate per component)
adaptive_window = 0.5
; Ensemble size for eemd / ceemdan (ignored by method = emd)
trials = 30
